<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="课程目录">
      <a class="brand" href="index.html"><span class="brand-mark">∑</span><div><strong>小小数学岛</strong><small>北师大版 · 三下</small></div></a>
      <div class="book-progress"><div><span>整册进度</span><b id="bookProgressText">0%</b></div><div class="progress-track"><i id="bookProgressBar"></i></div></div>
      <nav class="chapter-nav" id="chapterNav"></nav>

    <main class="main-content">

      <section id="mapView" class="view active">
        <div class="course-hero"><div><span class="eyebrow">北师大版 · 三年级下册</span><h1>这一册，我们要去<br><em>11 座数学小岛</em></h1><p>7个单元、2个综合实践、1个数学好玩和1次整册复习。每一站都能看、能动手、能闯关。</p><button class="primary-button" id="continueButton">从第一单元开始 →</button></div><div class="route-picture" id="routePicture"></div></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div><div class="confetti" id="confetti"></div>
